name: Deploy to GitHub Pages

# Fork: deploy only when triggered by hand, so pushes never publish anything.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          # Set the COLLAB_WS_BASE repo variable to your own Worker's wss:// URL.
          VITE_COLLAB_WS_BASE: ${{ vars.COLLAB_WS_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
